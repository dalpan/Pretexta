type: challenge
title: "Email Phishing: IT Security Alert"
description: "You receive an urgent email from 'IT Security' asking you to verify your account credentials. Identify the phishing attempt and respond correctly."
difficulty: easy
cialdini_categories:
  - authority
  - scarcity
estimated_time: 8

metadata:
  author: "Pretexta Lab"
  tags: [phishing, email, credential_harvest, offensive_awareness]
  attack_vector: email
  technique: "Credential Harvesting via Fake Login Portal"
  mitre_technique: "T1566.001 - Spearphishing Attachment"

nodes:
  - id: start
    type: message
    channel: email_inbox
    content_en:
      subject: "⚠️ URGENT: Your Account Will Be Suspended in 24 Hours"
      from: "security-noreply@company-it-support.net"
      body: |
        Dear Employee,

        Our security systems have detected unauthorized access attempts on your account.

        To prevent account suspension, you must verify your credentials immediately:
        → Click here to verify: http://secure-login-verify.company-it-support.net/login

        Failure to verify within 24 hours will result in account termination.

        IT Security Team
        Company Name
    content_id:
      subject: "⚠️ MENDESAK: Akun Anda Akan Ditangguhkan dalam 24 Jam"
      from: "security-noreply@company-it-support.net"
      body: |
        Yth. Karyawan,

        Sistem keamanan kami mendeteksi percobaan akses tidak sah pada akun Anda.

        Untuk mencegah penangguhan akun, Anda harus memverifikasi kredensial Anda segera:
        → Klik di sini untuk verifikasi: http://secure-login-verify.company-it-support.net/login

        Kegagalan memverifikasi dalam 24 jam akan mengakibatkan penghentian akun.

        Tim Keamanan IT
    next: choice_1

  - id: choice_1
    type: question
    content_en:
      text: "You received this security alert. What do you do first?"
    content_id:
      text: "Anda menerima peringatan keamanan ini. Apa yang pertama Anda lakukan?"
    options:
      - text: "Click the link and enter my credentials to avoid suspension"
        text_id: "Klik tautan dan masukkan kredensial untuk menghindari penangguhan"
        next: clicked_link
        score_impact: -30
        cialdini_trigger: scarcity
      - text: "Check the sender's email domain before doing anything"
        text_id: "Periksa domain email pengirim sebelum melakukan apapun"
        next: check_domain
        score_impact: +20
      - text: "Forward the email to IT department to verify"
        text_id: "Teruskan email ke departemen IT untuk verifikasi"
        next: reported_it
        score_impact: +15
      - text: "Delete the email — it looks suspicious"
        text_id: "Hapus email — terlihat mencurigakan"
        next: deleted_email
        score_impact: +10

  - id: clicked_link
    type: message
    channel: email_inbox
    content_en:
      subject: "Credential Harvesting Simulation Complete"
      from: "system@pretexta.lab"
      body: |
        SIMULATION ALERT: You clicked the phishing link.

        In a real attack, your credentials would now be stolen.
        The attacker used a lookalike domain: company-it-support.net (not company.com)

        Red flags you missed:
        • Sender domain: company-IT-support.NET (not company.COM)
        • Urgent time pressure (24 hours)
        • Generic greeting "Dear Employee"
        • HTTP link (not HTTPS with valid cert)
        • Threatening language
    content_id:
      subject: "Simulasi Pemanenan Kredensial Selesai"
      from: "system@pretexta.lab"
      body: |
        PERINGATAN SIMULASI: Anda mengklik tautan phishing.

        Dalam serangan nyata, kredensial Anda sekarang sudah dicuri.
    next: bad_outcome

  - id: check_domain
    type: message
    channel: email_inbox
    content_en:
      subject: "Good instinct! Now what do you see?"
      from: "system@pretexta.lab"
      body: |
        You checked the sender domain. You noticed:
        • Real IT: security@company.COM
        • This email: security-noreply@company-IT-support.NET

        The domain is different! This is a lookalike domain designed to deceive.
        What is your next action?
    content_id:
      subject: "Insting bagus! Sekarang apa yang Anda lihat?"
      from: "system@pretexta.lab"
      body: |
        Anda memeriksa domain pengirim. Anda melihat:
        • IT asli: security@company.COM
        • Email ini: security-noreply@company-IT-support.NET
        Domain berbeda! Ini domain lookalike untuk menipu.
    next: choice_2

  - id: choice_2
    type: question
    content_en:
      text: "The sender domain is suspicious. What now?"
    content_id:
      text: "Domain pengirim mencurigakan. Sekarang apa?"
    options:
      - text: "Report it to real IT security and delete the email"
        text_id: "Laporkan ke IT security asli dan hapus email"
        next: good_outcome
        score_impact: +25
      - text: "Click the link anyway — my account might really be at risk"
        text_id: "Klik tautannya tetap — akun saya mungkin benar-benar berisiko"
        next: clicked_link
        score_impact: -20
        cialdini_trigger: scarcity

  - id: reported_it
    type: end
    result: success
    content_en:
      title: "Excellent! Threat Reported."
      explanation: |
        You did the right thing by reporting to IT.

        Attack analysis:
        • Technique: Credential Harvesting via lookalike domain
        • Trigger used: Scarcity (24-hour deadline) + Authority (IT Security)
        • Red flags: wrong domain, urgency, generic greeting, threatening language

        Defense: Always verify security emails through official internal channels, not by clicking links in the email itself.
    content_id:
      title: "Bagus! Ancaman Dilaporkan."
      explanation: |
        Anda melakukan hal yang benar dengan melaporkan ke IT.

        Analisis serangan: Teknik pemanenan kredensial menggunakan domain lookalike.
        Selalu verifikasi email keamanan melalui saluran internal resmi.

  - id: deleted_email
    type: message
    channel: email_inbox
    content_en:
      subject: "Good instinct, but there's a better action"
      from: "system@pretexta.lab"
      body: |
        Deleting the phishing email is good, but reporting it to IT Security is even better.

        By reporting, IT can:
        • Block the sender for all employees
        • Analyze the attack campaign
        • Issue a company-wide warning
    content_id:
      subject: "Insting bagus, tapi ada tindakan yang lebih baik"
      from: "system@pretexta.lab"
      body: "Menghapus email phishing itu bagus, tetapi melaporkan ke IT Security lebih baik."
    next: good_outcome

  - id: good_outcome
    type: end
    result: success
    content_en:
      title: "Phishing Attack Defeated!"
      explanation: |
        Well done! You identified and correctly handled the phishing attempt.

        Key indicators you should always check:
        1. Sender domain — must match official company domain exactly
        2. Urgency/threats — legitimate IT never suspends without warning
        3. Generic greeting — IT knows your name
        4. Link destination — hover before clicking, check for HTTPS
        5. Unusual request — IT never asks credentials via email

        This technique (T1566.001) is responsible for 90% of successful breaches.
    content_id:
      title: "Serangan Phishing Dikalahkan!"
      explanation: |
        Bagus sekali! Anda mengidentifikasi dan menangani upaya phishing dengan benar.

        Indikator kunci: domain pengirim, urgensi/ancaman, sapaan generik, tujuan tautan.
        Teknik ini bertanggung jawab atas 90% pelanggaran yang berhasil.

  - id: bad_outcome
    type: end
    result: failure
    content_en:
      title: "Credentials Compromised!"
      explanation: |
        You fell for a credential harvesting phishing attack.

        What happened:
        1. You clicked a link to a fake login page
        2. You entered your username and password
        3. The attacker now has your credentials
        4. They will use these to access company systems, email, and possibly other accounts

        Defense lessons:
        • ALWAYS check the sender domain (company-it-support.NET ≠ company.COM)
        • Legitimate IT never asks you to "verify credentials" via email link
        • When in doubt, call IT directly or open your browser and type the URL manually
        • Report suspicious emails instead of clicking anything
    content_id:
      title: "Kredensial Dikompromikan!"
      explanation: |
        Anda terjebak dalam serangan phishing pemanenan kredensial.

        Pelajaran: Selalu periksa domain pengirim. IT yang sah tidak pernah meminta verifikasi kredensial melalui tautan email.
