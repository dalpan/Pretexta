services:
  mongodb:
    image: mongo:7.0
    container_name: soceng_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-soceng_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?run make up (or scripts/init-env.sh) to create .env}
      MONGO_INITDB_DATABASE: ${DB_NAME:-Pretexta}
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "127.0.0.1:${MONGO_PORT:-47017}:27017"
    networks:
      - soceng_network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      network: host
    container_name: soceng_backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://${MONGO_USERNAME:-soceng_admin}:${MONGO_PASSWORD}@mongodb:27017/${DB_NAME:-Pretexta}?authSource=admin
      DB_NAME: ${DB_NAME:-Pretexta}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-9443},http://localhost:80,http://localhost:3000}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-soceng}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_DISPLAY_NAME: ${SEED_ADMIN_DISPLAY_NAME:-Admin}
    volumes:
      - ./data:/app/data
      - ./bin:/app/bin
    ports:
      - "${BACKEND_PORT:-9442}:8001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - soceng_network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      network: host
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:9442}
    container_name: soceng_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-9443}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - soceng_network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
    driver: local

networks:
  soceng_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: pretexta0
