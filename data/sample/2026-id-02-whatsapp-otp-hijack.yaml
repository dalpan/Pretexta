  - id: forwarded_otp
    type: message
    channel: whatsapp
    content_id:
      from: "sistem@pretexta.lab"
      body: |
        ⚠️ PERINGATAN SIMULASI

        Dalam serangan nyata:
        1. Kode yang Anda kirim adalah kode aktivasi WhatsApp ANDA SENDIRI
        2. Penipu langsung mengambil alih akun WhatsApp Anda
        3. Penipu menghubungi SELURUH kontak Anda meminta transfer uang darurat
        4. Dalam 1 jam, puluhan orang di kontak Anda bisa menjadi korban berikutnya

        FAKTA: Akun WhatsApp yang dibajak rata-rata digunakan untuk menipu
        5-15 orang lain sebelum dilaporkan dan diblokir.

        Akun WhatsApp Reza yang asli SUDAH dibajak sebelumnya dengan cara yang sama.
    content_en:
      from: "sistem@pretexta.lab"
      body: |
        SIMULATION WARNING: The code was YOUR OWN WhatsApp activation code.
        The attacker now controls your WhatsApp and will scam all your contacts.
    next: bad_outcome

  - id: good_outcome
    type: end
    result: success
    content_id:
      title: "Pembajakan WhatsApp Digagalkan!"
      explanation: |
        Anda berhasil mendeteksi modus pembajakan WhatsApp yang paling umum di Indonesia.

        Mekanisme serangan:
        1. Penipu pertama membajak akun WA korban pertama (dengan cara yang sama)
        2. Menggunakan akun yang dibajak untuk menghubungi kontak-kontaknya
        3. Meminta kode OTP yang masuk — kode itu sebenarnya adalah kode aktivasi WA Anda
        4. Setelah dapat kode, akun WA Anda langsung dibajak
        5. Siklus berlanjut ke kontak-kontak Anda

        ATURAN EMAS:
        • TIDAK ADA SISTEM YANG SAH yang meminta kode OTP dikirim ke orang lain
        • Kode OTP adalah RAHASIA MUTLAK — tidak untuk siapapun, termasuk "teman"
        • Selalu verifikasi via telepon langsung (bukan chat) jika ragu
        • Aktifkan two-step verification di WhatsApp (Pengaturan → Akun → Verifikasi dua langkah)
    content_en:
      title: "WhatsApp Hijacking Defeated!"
      explanation: |
        You identified the most common account takeover scam in Indonesia.
        Golden rule: NO legitimate system ever asks you to forward OTP codes to anyone.

  - id: bad_outcome
    type: end
    result: failure
    content_id:
      title: "Akun WhatsApp Dibajak!"
      explanation: |
        Anda menjadi korban modus pembajakan WhatsApp via OTP yang sangat umum di Indonesia.

        Yang terjadi selanjutnya dalam serangan nyata:
        1. Penipu kini mengendalikan akun WA Anda
        2. Mereka mengirim pesan ke semua kontak Anda meminta "pinjaman darurat"
        3. Meminta transfer via GoPay/OVO/dana atau transfer bank "karena HP ketinggalan"
        4. Banyak kontak Anda akan terkena tipu karena percaya itu dari Anda

        Cara pemulihan jika terjadi:
        • Daftar ulang WA Anda segera dengan nomor yang sama
        • Hubungi kontak penting untuk memperingatkan mereka
        • Laporkan ke Kominfo: aduankonten.id
        • Aktifkan two-step verification setelah akun dipulihkan

        Taktik yang digunakan:
        • Liking: memanfaatkan kepercayaan pertemanan
        • Scarcity: tenggat waktu 5 menit yang mendesak
    content_en:
      title: "WhatsApp Account Hijacked!"
      explanation: |
        You fell for Indonesia's most common social engineering attack.
        The OTP was your own WhatsApp activation code. The attacker now has full control of your account.
