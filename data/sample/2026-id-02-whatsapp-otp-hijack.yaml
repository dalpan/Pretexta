type: challenge
title: "Pembajakan WhatsApp via Kode OTP"
description: "Seseorang mengaku teman Anda meminta kode OTP yang dikirim ke nomor Anda. Kenali serangan pembajakan akun WhatsApp yang sangat umum di Indonesia."
difficulty: easy
cialdini_categories:
  - liking
  - scarcity

metadata:
  author: "Pretexta Lab"
  tags: [whatsapp, otp, social_engineering, account_takeover, indonesia, mobile]
  attack_vector: sms_whatsapp
  technique: "Account Takeover via OTP Forwarding"
  mitre_technique: "T1078 - Valid Accounts"
  context_id: "Modus pembajakan WhatsApp adalah salah satu serangan siber terbanyak di Indonesia — penipu memanfaatkan kepercayaan pertemanan untuk mendapatkan kode OTP."

nodes:
  - id: start
    type: message
    channel: whatsapp
    content_id:
      from: "Reza (teman SMA) — +62812-XXXX-XXXX"
      body: |
        Heyy! Bro, maaf ganggu. Tolong bantu aku dong, darurat banget nih 😅

        Aku lagi daftar akun buat lomba coding, tapi nomorku udah dipakai di device lain.
        Nanti bakal ada kode 6 digit yang masuk ke WA kamu — itu buat verifikasi aku.

        Langsung forward ke aku ya begitu dapat? Makasih banget bro, gua balikin nanti 🙏
    content_en:
      from: "Reza (high school friend) — +62812-XXXX-XXXX"
      body: |
        Hey! Sorry to bother you. Can you help me? It's urgent 😅
        I'm registering for a coding contest but my number is already used on another device.
        A 6-digit code will come to your WhatsApp — it's for my verification.
        Just forward it to me when you get it? Thanks so much, I'll return the favor 🙏
    next: choice_1

  - id: choice_1
