type: challenge
title: "Rekayasa Sosial: Rekan Baru yang Terlalu Ramah"
description: "Rekan kerja baru di tim Anda sangat ramah dan membangun hubungan baik. Setelah beberapa hari, dia mulai menggali informasi sensitif tentang sistem dan prosedur internal. Kenali rekayasa sosial lewat hubungan pertemanan."
difficulty: medium
cialdini_categories:
  - liking
  - reciprocity
  - commitment

metadata:
  author: "Pretexta Lab"
  tags: [social_engineering, insider_threat, pretexting, reconnaissance, indonesia, workplace]
  attack_vector: in_person_chat
  technique: "Pretexting — Insider Reconnaissance via Rapport Building"
  mitre_technique: "T1598 - Phishing for Information"
  context_id: "Rekayasa sosial melalui hubungan pertemanan adalah teknik paling efektif — korban tidak menyadari sedang dimanipulasi karena rasa kepercayaan yang sudah terbangun."

nodes:
  - id: start
    type: message
    channel: chat
    content_id:
      from: "Farid — Karyawan Baru (IT)"
      body: |
        Hei! Gimana kabar? Aku Farid, baru gabung minggu lalu di divisi IT.
        Kamu udah lama di sini ya? Kayaknya kamu tau banyak soal sistem di sini.

        Ngomong-ngomong, nanti makan siang bareng yuk? Aku masih adaptasi
        dan pengen kenal lebih banyak orang di kantor 😊
    content_en:
      from: "Farid — New Employee (IT)"
      body: |
        Hey! How are you? I'm Farid, just joined last week in IT.
        You've been here a while? You seem to know a lot about the systems here.
        Lunch together later? I'm still adapting and want to meet more people 😊
    next: choice_1

  - id: choice_1
    type: question
    content_id:
      text: "Karyawan baru dari divisi IT mengajak makan siang. Apa respons Anda?"
    content_en:
      text: "New IT employee invites you to lunch. What's your response?"
    options:
      - text: "Ajak makan siang — itu hal normal dan ramah untuk dilakukan"
        text_id: "Ajak makan siang — itu hal normal dan ramah untuk dilakukan"
        next: lunch
        score_impact: 0
      - text: "Tolak halus — lebih baik tidak bergaul dengan orang yang baru dikenal"
        text_id: "Tolak halus — lebih baik tidak bergaul dengan orang yang baru dikenal"
        next: declined
        score_impact: 0

  - id: declined
    type: message
    channel: chat
    content_id:
      from: "Farid"
      body: |
        Oh oke, ga apa-apa. Mungkin lain kali ya!
        Eh tapi sambil ngobrol sebentar aja boleh ga?
        Aku lagi kebingungan soal sistem helpdesk yang kita pakai.
        Ticket yang aku buka kemarin kok ga bisa diakses?
        Password system helpdesk-nya ada di dokumentasi yang mana ya?
    content_en:
      from: "Farid"
      body: |
        Oh okay, maybe next time!
        But can we chat briefly? I'm confused about the helpdesk system.
        My ticket from yesterday isn't accessible. Where's the helpdesk system password documentation?
    next: choice_2

  - id: lunch
    type: message
    channel: chat
    content_id:
      from: "sistem@pretexta.lab"
      body: |
        Makan siang berlangsung menyenangkan. Farid terdengar ramah, bercerita tentang
        pengalamannya sebelumnya di perusahaan tech, bertanya tentang keluarga Anda,
        dan menawarkan untuk mengajari Anda beberapa shortcut Excel yang berguna.

        Keesokan harinya, dia menghubungi Anda lagi via chat...
    content_en:
      from: "sistem@pretexta.lab"
      body: |
        Lunch was pleasant. Farid seemed friendly, shared his background, asked about your family,
        offered to teach you some Excel shortcuts. The next day, he contacts you again...
    next: next_day

  - id: next_day
    type: message
    channel: chat
    content_id:
      from: "Farid"
      body: |
        Makasih banyak kemarin ya! Nanti aku kirimin shortcut Excel-nya 😊

        Oh iya, aku mau tanya — kamu tahu nomor IP server production kita yang utama?
        Aku lagi mapping infrastruktur untuk dokumentasi, tapi dokumennya belum lengkap
        dan supervisorku lagi meeting seharian. Urgent nih buat presentasi sore ini.
    content_en:
      from: "Farid"
      body: |
        Thanks for yesterday! I'll send those Excel shortcuts 😊
        By the way, do you know the IP address of our main production server?
        I'm mapping infrastructure for documentation, my supervisor is in meetings all day,
        and I need it for a presentation this afternoon.
    next: choice_2

  - id: choice_2
    type: question
    content_id:
      text: "Farid (yang kemarin ajak makan siang) meminta nomor IP server production. Apa respons Anda?"
    content_en:
      text: "Farid (who had lunch with you) asks for production server IP. Your response?"
    options:
      - text: "Berikan — dia rekan kerja di IT, mungkin memang perlu"
        text_id: "Berikan — dia rekan kerja di IT, mungkin memang perlu"
