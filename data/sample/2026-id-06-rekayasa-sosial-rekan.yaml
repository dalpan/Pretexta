      - text: "Sarankan dia tanya langsung ke supervisor atau akses dokumentasi resmi"
        text_id: "Sarankan dia tanya langsung ke supervisor atau akses dokumentasi resmi"
        next: redirected
        score_impact: +25
      - text: "Tanya kenapa dia tidak punya akses ke dokumentasi sistem melalui jalur resmi"
        text_id: "Tanya kenapa dia tidak punya akses ke dokumentasi sistem melalui jalur resmi"
