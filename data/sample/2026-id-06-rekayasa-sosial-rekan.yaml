        score_impact: +25

  - id: gave_info
    type: message
    channel: chat
    content_id:
      from: "Farid"
      body: |
        Wah makasih! Kamu baik banget. Oh iya, IP-nya pakai autentikasi apa?
        Basic auth atau ada VPN khusus? Dan port berapa yang dibuka?

        Oh sama, password default untuk monitoring dashboard ada yang tau ga?
        Tadi aku coba akses tapi ga bisa masuk.
    content_en:
      from: "Farid"
      body: |
        Thanks so much! You're so helpful. What authentication does it use?
        Basic auth or special VPN? Which ports are open?
        Also, does anyone know the default password for the monitoring dashboard?
    next: choice_3

  - id: choice_3
    type: question
    content_id:
      text: "Setelah dapat IP server, Farid kini bertanya tentang autentikasi, port, dan password. Pola apa yang Anda lihat?"
    content_en:
      text: "After getting server IP, Farid now asks about auth, ports, and passwords. What pattern do you see?"
    options:
      - text: "Terus bantu — mungkin dia memang sedang dokumentasi infrastruktur"
        text_id: "Terus bantu — mungkin dia memang sedang dokumentasi infrastruktur"
        next: gave_more_info
        score_impact: -30
        cialdini_trigger: commitment
      - text: "Hentikan dan laporkan ke atasan dan tim keamanan"
        text_id: "Hentikan dan laporkan ke atasan dan tim keamanan"
        next: good_outcome
        score_impact: +25
      - text: "Tanya supervisor Farid untuk konfirmasi bahwa ini memang tugasnya"
        text_id: "Tanya supervisor Farid untuk konfirmasi bahwa ini memang tugasnya"
